<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Escalation Tracker</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #080a12;
    --panel: rgba(18, 22, 39, 0.82);
    --panel-light: #181d31;
    --text: #f5f7ff;
    --muted: #8990aa;
    --border: rgba(255,255,255,.08);

    --purple: #d18cff;
    --purple-glow: rgba(209,140,255,.35);

    --cyan: #68ddff;
    --cyan-glow: rgba(104,221,255,.3);

    --yellow: #ffe26d;
    --orange: #ff9d70;
    --green: #69f0c1;
    --pink: #ff87d7;
    --red: #ff7f96;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background:
        radial-gradient(circle at 15% 0%, rgba(120,77,255,.12), transparent 28%),
        radial-gradient(circle at 90% 20%, rgba(0,204,255,.08), transparent 25%),
        var(--bg);
    color: var(--text);
    font-family: "DM Sans", sans-serif;
    min-height: 100vh;
}

button,
input,
select,
textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

.app {
    display: flex;
    min-height: 100vh;
}

/* SIDEBAR */

.sidebar {
    width: 260px;
    min-height: 100vh;
    background: rgba(8,10,18,.78);
    border-right: 1px solid var(--border);
    padding: 24px 16px;
    position: sticky;
    top: 0;
    height: 100vh;
    backdrop-filter: blur(20px);
    z-index: 20;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 10px 30px;
}

.brand-icon {
    width: 48px;
    height: 48px;
    display: grid;
    place-items: center;
    border: 1px solid var(--purple);
    border-radius: 15px;
    background: rgba(209,140,255,.12);
    box-shadow: 0 0 25px var(--purple-glow);
    font-size: 22px;
}

.brand h1 {
    margin: 0;
    font-family: "Space Grotesk", sans-serif;
    font-size: 17px;
    letter-spacing: .8px;
}

.brand span {
    color: var(--purple);
    font-size: 11px;
    display: block;
    margin-top: 2px;
    letter-spacing: 1.5px;
}

.nav-section {
    margin-bottom: 24px;
}

.nav-label {
    color: #596078;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.4px;
    padding: 0 12px 10px;
}

.nav-item {
    width: 100%;
    border: none;
    color: #aeb5c9;
    background: transparent;
    padding: 13px 12px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 5px;
    text-align: left;
    transition: .2s ease;
}

.nav-item:hover {
    background: rgba(255,255,255,.04);
    color: white;
}

.nav-item.active {
    background: linear-gradient(90deg, rgba(209,140,255,.2), rgba(104,221,255,.08));
    border: 1px solid rgba(209,140,255,.25);
    color: white;
    box-shadow: 0 0 20px rgba(209,140,255,.08);
}

.nav-icon {
    width: 22px;
    text-align: center;
}

.nav-count {
    margin-left: auto;
    min-width: 24px;
    height: 24px;
    padding: 0 7px;
    border-radius: 8px;
    display: grid;
    place-items: center;
    font-size: 11px;
    font-weight: 700;
}

.count-ready {
    color: var(--cyan);
    background: rgba(104,221,255,.13);
}

.count-waiting {
    color: var(--yellow);
    background: rgba(255,226,109,.13);
}

.count-pending {
    color: var(--orange);
    background: rgba(255,157,112,.13);
}

.count-escalated {
    color: var(--green);
    background: rgba(105,240,193,.13);
}

.sidebar-bottom {
    position: absolute;
    bottom: 22px;
    left: 16px;
    right: 16px;
}

.motivation {
    padding: 18px;
    border-radius: 16px;
    border: 1px solid rgba(209,140,255,.18);
    background:
        radial-gradient(circle at 20% 10%, rgba(209,140,255,.15), transparent 40%),
        var(--panel);
}

.motivation strong {
    color: var(--pink);
    font-size: 13px;
}

.motivation p {
    margin: 7px 0 0;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.5;
}

/* MAIN */

.main {
    flex: 1;
    min-width: 0;
    padding: 34px;
}

.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 28px;
}

.greeting h2 {
    margin: 0;
    font-family: "Space Grotesk", sans-serif;
    font-size: clamp(24px, 3vw, 34px);
}

.greeting p {
    color: var(--muted);
    margin: 7px 0 0;
    font-size: 14px;
}

.top-actions {
    display: flex;
    align-items: center;
    gap: 10px;
}

.icon-btn {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    transition: .2s;
}

.icon-btn:hover {
    border-color: var(--purple);
    box-shadow: 0 0 18px var(--purple-glow);
}

.add-btn {
    border: 1px solid var(--purple);
    background: linear-gradient(135deg, rgba(209,140,255,.2), rgba(255,135,215,.12));
    color: white;
    padding: 12px 18px;
    border-radius: 12px;
    font-weight: 700;
    box-shadow: 0 0 25px rgba(209,140,255,.12);
    transition: .2s;
}

.add-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 30px var(--purple-glow);
}

/* STATS */

.stats {
    display: grid;
    grid-template-columns: repeat(5, minmax(150px, 1fr));
    gap: 16px;
    margin-bottom: 26px;
}

.stat-card {
    min-height: 132px;
    padding: 20px;
    border-radius: 18px;
    background: var(--panel);
    border: 1px solid var(--border);
    position: relative;
    overflow: hidden;
    transition: .2s;
}

.stat-card:hover {
    transform: translateY(-3px);
}

.stat-card::after {
    content: "";
    position: absolute;
    width: 100px;
    height: 100px;
    right: -35px;
    bottom: -40px;
    border-radius: 50%;
    filter: blur(20px);
    opacity: .25;
}

.stat-title {
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .6px;
    text-transform: uppercase;
}

.stat-number {
    font-family: "Space Grotesk", sans-serif;
    font-size: 35px;
    margin-top: 14px;
    font-weight: 700;
}

.stat-sub {
    color: var(--muted);
    font-size: 11px;
    margin-top: 3px;
}

.stat-purple {
    border-color: rgba(209,140,255,.3);
}

.stat-purple::after {
    background: var(--purple);
}

.stat-yellow {
    border-color: rgba(255,226,109,.3);
}

.stat-yellow::after {
    background: var(--yellow);
}

.stat-cyan {
    border-color: rgba(104,221,255,.3);
}

.stat-cyan::after {
    background: var(--cyan);
}

.stat-orange {
    border-color: rgba(255,157,112,.3);
}

.stat-orange::after {
    background: var(--orange);
}

.stat-green {
    border-color: rgba(105,240,193,.3);
}

.stat-green::after {
    background: var(--green);
}

/* FILTERS */

document.querySelectorAll(".nav-item[data-filter]")
.forEach(button => {

    button.addEventListener("click", () => {

        document.querySelectorAll(".nav-item[data-filter]")
            .forEach(btn => btn.classList.remove("active"));

        button.classList.add("active");

        currentFilter = button.dataset.filter;

        if (currentFilter !== "all") {
            searchInput.value = "";
            statusFilter.value = "all";
        }

        renderCases();
    });
});

statusFilter.addEventListener("change", () => {
    if (currentFilter === "all") {
        renderCases();
    }
});

searchInput.addEventListener("input", renderCases);
sortFilter.addEventListener("change", renderCases);



/* TOAST */

let toastTimer;

function showToast(message) {

    const toast = document.getElementById("toast");

    toast.textContent = message;
    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer = setTimeout(() => {
        toast.classList.remove("show");
    }, 2800);
}


/* CUSTOMIZABLE DASHBOARD NAME */

const displayName = document.getElementById("displayName");
const editNameBtn = document.getElementById("editNameBtn");
const nameModal = document.getElementById("nameModal");
const nameInput = document.getElementById("nameInput");
const closeNameModalBtn = document.getElementById("closeNameModalBtn");
const cancelNameBtn = document.getElementById("cancelNameBtn");
const saveNameBtn = document.getElementById("saveNameBtn");

function loadDashboardName() {
    const savedName = localStorage.getItem("dashboardUserName");

    if (savedName) {
        displayName.textContent = savedName;
    }
}

function openNameModal() {
    nameInput.value = displayName.textContent;
    nameModal.classList.add("show");

    setTimeout(() => {
        nameInput.focus();
        nameInput.select();
    }, 100);
}

function closeNameModal() {
    nameModal.classList.remove("show");
}

editNameBtn.addEventListener("click", openNameModal);
closeNameModalBtn.addEventListener("click", closeNameModal);
cancelNameBtn.addEventListener("click", closeNameModal);

nameModal.addEventListener("click", e => {
    if (e.target === nameModal) {
        closeNameModal();
    }
});

saveNameBtn.addEventListener("click", () => {
    const newName = nameInput.value.trim();

    if (!newName) {
        nameInput.focus();
        showToast("Please enter your name first.");
        return;
    }

    displayName.textContent = newName;
    localStorage.setItem("dashboardUserName", newName);
    closeNameModal();
    showToast(`Welcome back, ${newName}! 👋`);
});

nameInput.addEventListener("keydown", e => {
    if (e.key === "Enter") {
        saveNameBtn.click();
    }

    if (e.key === "Escape") {
        closeNameModal();
    }
});



/* REVIEWS TRACKER */
let reviews = JSON.parse(localStorage.getItem("reviewTrackerEntries")) || [];
const BONUS_PER_SUCCESS = 40;
const reviewsNavBtn = document.getElementById("reviewsNavBtn");
const reviewsView = document.getElementById("reviewsView");
const reviewModal = document.getElementById("reviewModal");
const reviewForm = document.getElementById("reviewForm");
const reviewSearchInput = document.getElementById("reviewSearchInput");
const reviewStatusFilter = document.getElementById("reviewStatusFilter");
const reviewsTableBody = document.getElementById("reviewsTableBody");
const reviewsEmpty = document.getElementById("reviewsEmpty");
function saveReviews(){localStorage.setItem("reviewTrackerEntries",JSON.stringify(reviews));}
function reviewLabel(s){return s==="successful"?"Successful":s==="not-reviewed"?"Not Reviewed":"Pending";}
function formatReviewDate(value){if(!value)return "—";const d=new Date(value+"T00:00:00");return d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});}
function todayReviewDate(){return new Date().toISOString().slice(0,10);}
function renderReviews(){
 const q=(reviewSearchInput.value||"").toLowerCase().trim(), f=reviewStatusFilter.value;
 const filtered=reviews.filter(r=>(f==="all"||r.status===f)&&(`${r.username||""} ${r.link||""}`).toLowerCase().includes(q));
 const pending=reviews.filter(r=>r.status==="pending").length, success=reviews.filter(r=>r.status==="successful").length;
 document.getElementById("reviewTotalCount").textContent=reviews.length; document.getElementById("reviewPendingCount").textContent=pending; document.getElementById("reviewSuccessCount").textContent=success; document.getElementById("reviewBonusTotal").textContent=`$${success*BONUS_PER_SUCCESS}`; document.getElementById("reviewsNavCount").textContent=pending;
 reviewsTableBody.innerHTML=filtered.map(r=>`<tr><td>${escapeHTML(r.username||"—")}</td><td><a class="review-link" href="${escapeHTML(r.link)}" target="_blank" rel="noopener"><svg class="icon-line" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.1.1l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1"/><path d="M14 11a5 5 0 0 0-7.1-.1l-2 2A5 5 0 0 0 12 20l1.1-1.1"/></svg>Open conversation</a></td><td>${formatReviewDate(r.reviewDate || new Date(r.createdAt).toISOString().slice(0,10))}</td><td><span class="review-status ${r.status}">${reviewLabel(r.status)}</span></td><td class="review-bonus">${r.status==="successful"?"+$40":"—"}</td><td><div class="review-actions"><button class="review-action" onclick="editReview('${r.id}')" title="Edit"><svg class="icon-line" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg></button><button class="review-action delete" onclick="deleteReview('${r.id}')" title="Delete"><svg class="icon-line" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 14h10l1-14M9 7V4h6v3"/></svg></button></div></td></tr>`).join("");
 reviewsEmpty.style.display=filtered.length?"none":"block";
}
function openReviewModal(item=null){reviewForm.reset();document.getElementById("reviewId").value=item?.id||"";document.getElementById("reviewUsername").value=item?.username||"";document.getElementById("reviewLink").value=item?.link||"";document.getElementById("reviewDate").value=item?.reviewDate||todayReviewDate();document.getElementById("reviewStatus").value=item?.status||"pending";document.getElementById("reviewModalTitle").textContent=item?"Edit Review":"Add Review";reviewModal.classList.add("show");}
function closeReviewModal(){reviewModal.classList.remove("show");}
window.editReview=id=>{const r=reviews.find(x=>x.id===id);if(r)openReviewModal(r);};
window.deleteReview=id=>{if(confirm("Delete this review entry?")){reviews=reviews.filter(r=>r.id!==id);saveReviews();renderReviews();showToast("Review entry deleted.");}};
reviewsNavBtn.addEventListener("click",()=>{const main=document.querySelector(".main");main.classList.remove("dashboard-mode");main.classList.add("review-mode");document.querySelectorAll(".nav-item.active").forEach(x=>x.classList.remove("active"));reviewsNavBtn.classList.add("active");renderReviews();});
document.querySelectorAll(".nav-item[data-filter]").forEach(btn=>btn.addEventListener("click",()=>document.querySelector(".main").classList.remove("review-mode")));
document.getElementById("openReviewModalBtn").addEventListener("click",()=>openReviewModal());document.getElementById("closeReviewModalBtn").addEventListener("click",closeReviewModal);document.getElementById("cancelReviewBtn").addEventListener("click",closeReviewModal);reviewModal.addEventListener("click",e=>{if(e.target===reviewModal)closeReviewModal();});
reviewForm.addEventListener("submit",e=>{e.preventDefault();const id=document.getElementById("reviewId").value;const data={username:document.getElementById("reviewUsername").value.trim(),link:document.getElementById("reviewLink").value.trim(),reviewDate:document.getElementById("reviewDate").value||todayReviewDate(),status:document.getElementById("reviewStatus").value};if(id){const r=reviews.find(x=>x.id===id);Object.assign(r,data);}else reviews.unshift({id:crypto.randomUUID(),createdAt:Date.now(),...data});saveReviews();closeReviewModal();renderReviews();showToast(id?"Review updated.":"Review added.");});
reviewSearchInput.addEventListener("input",renderReviews);reviewStatusFilter.addEventListener("change",renderReviews);renderReviews();

/* INIT */

loadDashboardName();
renderStats();
updateCaseView();
renderCases();

</script>

</body>
</html>
